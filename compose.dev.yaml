services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: workflow_brain
      POSTGRES_USER: workflow
      POSTGRES_PASSWORD: workflow
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - brain-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflow -d workflow_brain"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  brain-postgres-data:
