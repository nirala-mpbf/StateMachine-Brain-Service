spring:
  application:
    name: state-machine-brain

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/workflow}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true

  jackson:
    deserialization:
      fail-on-trailing-tokens: true
    read:
      strict-duplicate-detection: true

server:
  port: ${SERVER_PORT:8080}

logging:
  pattern:
    level: '%5p [correlationId:%X{correlationId:-} requestId:%X{requestId:-}]'